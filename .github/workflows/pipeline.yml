name: Security Pipeline & Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan-and-deploy:
    runs-on: self-hosted

    steps:
      # 1. Code ophalen
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Secret Scanning (Gitleaks)
      - name: Run Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. SCA - Dependency Scan (Trivy via apt of los script, of via de officiële setup)
      - name: Run SCA Scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

      # 4. SAST - Statische code analyse (gebruik Semgrep via Python pip in plaats van Docker container)
      - name: Run SAST Scan (Semgrep CLI)
        run: |
          pip install semgrep
          semgrep ci --config=auto || true

      # 5. Automatische uitrol (Deployment) via Docker Compose
      - name: Deploy application to server
        run: |
          echo "Scans afgerond! Start automatische deployment..."
          docker compose down
          docker compose up -d --build
