name: Security Pipeline & Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan-and-deploy:
    runs-on: self-hosted

    steps:
      # 1. Code ophalen
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Secret Scanning (Gitleaks) - Controle op hardcoded API-keys of wachtwoorden
      - name: Run Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. SCA (Trivy Filesystem) - Controle van .NET packages/dependencies op bekende CVE's
      - name: Run SCA Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Laat de pipeline falen bij nieuwe kritieke kwetsbaarheden

      # 4. SAST (Semgrep) - Statische code analyse op programmeerfouten
      - name: Run SAST Scan (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci

      # 5. Automatische uitrol (Deployment) via Docker Compose
      - name: Deploy application to server
        run: |
          echo "Scans geslaagd! Start automatische deployment..."
          docker compose down
          docker compose up -d --build
